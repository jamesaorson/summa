name: CI

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # asan: debug + ASan/UBSan. release: -c opt. See .bazelrc.
        config: [asan, release]
    name: ci (${{ matrix.config }})
    env:
      CONFIG: ${{ matrix.config }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          # Keyed per OS/arch (by the action) and per config (here), so the
          # asan and opt outputs never overwrite each other.
          disk-cache: ${{ matrix.config }}

      - name: Check versions
        run: |
          bazel --version
          gcc --version

      - name: Build
        run: |
          make build

      - name: Test
        run: |
          make test

      - name: Collect examples
        if: matrix.config == 'release'
        run: |
          mkdir -p dist
          find bazel-bin/examples/ -maxdepth 1 -type f -perm -u+x -exec cp {} dist/ \;

      - name: Upload examples
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: summa-examples
          path: dist/*
